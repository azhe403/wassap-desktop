name: Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            name: wassap-desktop-windows-amd64.exe
          - os: windows-latest
            platform: windows/arm64
            name: wassap-desktop-windows-arm64.exe
          - os: ubuntu-latest
            platform: linux/amd64
            name: wassap-desktop-linux-amd64
            tags: -tags webkit2_41
          - os: macos-latest
            platform: darwin/universal
            name: wassap-desktop-darwin-universal

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build binary
        run: |
          wails build -platform ${{ matrix.platform }} -o ${{ matrix.name }} ${{ matrix.tags }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/bin/*

  release:
    # Push ke main  -> pre-release rolling bertag `nightly`
    # Push tag v*    -> release stabil dengan auto-generated notes
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish pre-release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly
          gh release delete nightly --yes || true
          gh release create nightly \
            --prerelease \
            --title "Wassap Desktop nightly (${GITHUB_SHA::7})" \
            --notes "Automated pre-release from main @ ${GITHUB_SHA}" \
            artifacts/*

      - name: Publish stable release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Wassap Desktop ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
